name: Kongono App CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.5 App Quality Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: curl, dom, json, mbstring, openssl, pdo, sodium, zlib
          ini-values: session.upload_progress.enabled=Off, zend.exception_ignore_args=On, expose_php=Off
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify Zero Symfony Packages (Runtime & Dev)
        run: |
          if composer show | grep -qi "symfony/"; then
            echo "Unexpected Symfony package detected!"
            composer show | grep -i "symfony/"
            exit 1
          fi

      - name: Validate Composer Manifest & Security Audit
        run: |
          composer validate --strict
          composer audit --locked --abandoned=report

      - name: Run Post-Create-Project Setup & CLI Checks
        run: |
          composer run-script post-create-project-cmd
          php vendor/bin/kongo doctor
          php vendor/bin/kongo env:check
          php vendor/bin/kongo routes --json
          php vendor/bin/kongo optimize
          php vendor/bin/kongo audit --attack --strict

      - name: Static Analysis (PHPStan Level 9 + Strict)
        run: composer analyse

      - name: Test Suite (PHPUnit 13 Strict)
        run: composer test
